<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<title>景峰花園 ⇄ 嶺南大學 · 巴士到站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b1020'/><rect x='20' y='26' width='60' height='40' rx='8' fill='%237fb2ff'/><rect x='28' y='34' width='18' height='12' rx='3' fill='%230b1020'/><rect x='54' y='34' width='18' height='12' rx='3' fill='%230b1020'/><circle cx='34' cy='74' r='7' fill='%237fb2ff'/><circle cx='66' cy='74' r='7' fill='%237fb2ff'/></svg>">
<style>
  :root {
    --bg: #070a12;
    --text: #e9eefb;
    --muted: #8d97ad;
    --line: rgba(255, 255, 255, .09);
    --accent: #7fb2ff;
    --kmb-1: #e11d48;
    --kmb-2: #fb7185;
    --mtr-1: #6d28d9;
    --mtr-2: #a78bfa;
    --card: rgba(255, 255, 255, .055);
    --card-2: rgba(255, 255, 255, .028);
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    color: var(--text);
    background:
      radial-gradient(900px 520px at 8% -12%, rgba(59, 130, 246, .22), transparent 62%),
      radial-gradient(720px 520px at 104% 6%, rgba(139, 92, 246, .18), transparent 58%),
      radial-gradient(820px 620px at 50% 118%, rgba(16, 185, 129, .10), transparent 62%),
      var(--bg);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .app {
    width: min(760px, 100%);
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    padding: calc(22px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }

  /* ---------- header ---------- */

  .head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
  }

  .eyebrow {
    margin: 0 0 8px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  h1 {
    margin: 0;
    font-size: clamp(22px, 5.4vw, 31px);
    line-height: 1.16;
    font-weight: 800;
    letter-spacing: -.015em;
  }

  h1 .arrow {
    color: var(--accent);
    font-weight: 500;
    margin: 0 .1em;
  }

  .sub {
    margin: 7px 0 0;
    font-size: 12px;
    letter-spacing: .03em;
    color: var(--muted);
  }

  .clock {
    flex: none;
    padding: 7px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, .05);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ---------- tabs ---------- */

  .tabs {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-top: 22px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255, 255, 255, .05);
  }

  .thumb {
    position: absolute;
    top: 4px;
    left: 4px;
    width: calc(50% - 4px);
    height: calc(100% - 8px);
    border: 1px solid rgba(127, 178, 255, .34);
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(127, 178, 255, .26), rgba(127, 178, 255, .10));
    box-shadow: 0 8px 22px rgba(59, 130, 246, .16);
    transition: transform .28s cubic-bezier(.22, .61, .36, 1);
    pointer-events: none;
  }

  .tab {
    position: relative;
    z-index: 1;
    padding: 10px 8px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13.5px;
    font-weight: 650;
    cursor: pointer;
    transition: color .2s;
  }

  .tab small {
    display: block;
    margin-top: 2px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .02em;
    opacity: .8;
  }

  .tab[aria-selected="true"] { color: #fff; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .subline {
    margin: 12px 2px 0;
    font-size: 12px;
    letter-spacing: .02em;
    color: var(--muted);
  }

  /* ---------- toolbar ---------- */

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 12px 2px 8px;
    font-size: 11.5px;
    color: var(--muted);
  }

  .live {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    letter-spacing: .06em;
  }

  .live i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #34d399;
    animation: pulse 2.2s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(52, 211, 153, .55); }
    70%  { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
    100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  }

  #refresh {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255, 255, 255, .05);
    color: var(--text);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: background .2s, opacity .2s;
  }

  #refresh:hover { background: rgba(255, 255, 255, .09); }
  #refresh:active { transform: scale(.97); }
  #refresh.busy { opacity: .55; pointer-events: none; }

  .progress {
    height: 3px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255, 255, 255, .07);
  }

  .progress i {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), #34d399);
    transition: width .95s linear;
  }

  /* ---------- cards ---------- */

  .cards {
    display: grid;
    gap: 10px;
    margin-top: 14px;
  }

  .cards.swap { animation: swap .32s ease; }

  @keyframes swap {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: none; }
  }

  .card {
    display: grid;
    grid-template-columns: 84px minmax(0, 1fr);
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: linear-gradient(160deg, var(--card), var(--card-2));
    box-shadow: 0 12px 30px rgba(0, 0, 0, .18);
    transition: transform .2s, border-color .2s, opacity .2s;
  }

  .card:hover {
    transform: translateY(-1px);
    border-color: rgba(255, 255, 255, .16);
  }

  .card.stale { opacity: .62; }

  .left {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 64px;
    height: 44px;
    padding: 0 10px;
    border-radius: 12px;
    color: #fff;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .02em;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 7px 18px rgba(0, 0, 0, .28);
  }

  .badge.long { font-size: 15.5px; letter-spacing: 0; }

  .badge.kmb { background: linear-gradient(135deg, var(--kmb-1), var(--kmb-2)); }
  .badge.mtr { background: linear-gradient(135deg, var(--mtr-1), var(--mtr-2)); }

  .op {
    font-size: 10.5px;
    letter-spacing: .08em;
    color: var(--muted);
  }

  .right { min-width: 0; }

  .etas {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 7px;
  }

  .eta {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 3px;
    min-height: 58px;
    padding: 10px 4px 9px;
    border: 1px solid transparent;
    border-radius: 13px;
    background: rgba(255, 255, 255, .045);
  }

  .eta b {
    font-size: 27px;
    line-height: 1;
    font-weight: 750;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }

  .eta span {
    font-size: 10.5px;
    color: var(--muted);
  }

  .eta.next {
    border-color: rgba(127, 178, 255, .32);
    background: rgba(127, 178, 255, .10);
  }

  .eta.next b { color: #a9ccff; }

  .eta.soon b {
    font-size: 17px;
    color: #7ee7b0;
    letter-spacing: .04em;
  }

  .eta.empty b { color: rgba(255, 255, 255, .2); }

  .eta.loading b {
    color: var(--muted);
    letter-spacing: .12em;
    animation: blink 1.2s ease-in-out infinite;
  }

  @keyframes blink { 50% { opacity: .35; } }

  .err {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 7px 2px 0;
    font-size: 10.5px;
    color: #ff9aa8;
  }

  .err::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ff9aa8;
  }

  [hidden] { display: none !important; }

  /* ---------- note card ---------- */

  .card.note { opacity: .9; }

  .note-title {
    margin: 0;
    font-size: 14px;
    font-weight: 650;
    color: #ffd18a;
  }

  .note-sub {
    margin: 5px 0 0;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--muted);
  }

  /* ---------- footer ---------- */

  footer {
    margin-top: auto;
    padding-top: 20px;
    font-size: 10.5px;
    line-height: 1.7;
    color: var(--muted);
  }

  footer p { margin: 0 0 4px; }
  footer b { color: #b9c3d6; font-weight: 600; }

  @media (max-width: 420px) {
    .app { padding-left: 14px; padding-right: 14px; }
    .card { grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 12px; }
    .badge { min-width: 56px; height: 40px; font-size: 18px; }
    .badge.long { font-size: 14px; }
    .eta { min-height: 54px; }
    .eta b { font-size: 24px; }
    .toolbar { font-size: 10.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div>
      <p class="eyebrow">Real-time arrivals · 實時到站</p>
      <h1>景峰花園 <span class="arrow">⇄</span> 嶺南大學</h1>
      <p class="sub">Prime View Garden ⇄ Lingnan University</p>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="tabs" role="tablist" aria-label="方向">
    <span class="thumb" id="thumb"></span>
    <button class="tab" type="button" data-dir="out" role="tab" aria-selected="true">去程 <small>往嶺南大學</small></button>
    <button class="tab" type="button" data-dir="back" role="tab" aria-selected="false">回程 <small>往景峰花園</small></button>
  </div>

  <div class="subline" id="subline">上車 景峰花園 · 落車 嶺南大學</div>

  <div class="toolbar">
    <span class="live"><i></i> 實時</span>
    <span id="cd">30 秒後更新</span>
    <button id="refresh" type="button">↻ 立即更新</button>
  </div>
  <div class="progress"><i id="bar"></i></div>

  <main class="cards" id="cards"></main>

  <footer>
    <p>資料來源：<b>DATA.GOV.HK</b> — 九巴 67M / 67X / 261 及港鐵巴士 K51 / K51A 實時到站預報。班次由營運商提供，僅供參考。</p>
    <p>K51A 回程不經景峰花園，可改乘 K51 / 67M / 67X / 261。 · 最後更新 <span id="updated">—</span></p>
  </footer>
</div>

<script>
(() => {
  'use strict';

  const KMB_API = 'https://data.etabus.gov.hk/v1/transport/kmb/eta';
  const MTR_API = 'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule';
  const REFRESH_MS = 30000;

  const DIRECTIONS = {
    out: {
      board: '景峰花園',
      alight: '嶺南大學',
      routes: [
        { no: '67M',  op: 'kmb', stop: '02824AAFC038FA20', dir: 'I', st: 1 },
        { no: '67X',  op: 'kmb', stop: '02824AAFC038FA20', dir: 'I', st: 1 },
        { no: '261',  op: 'kmb', stop: '02824AAFC038FA20', dir: 'O', st: 1 },
        { no: 'K51',  op: 'mtr', stop: 'K51-D230' },
        { no: 'K51A', op: 'mtr', stop: 'K51A-D210' }
      ]
    },
    back: {
      board: '嶺南大學',
      alight: '景峰花園',
      routes: [
        { no: '67M',  op: 'kmb', stop: 'AA5DA45828958EAE', dir: 'O', st: 1 },
        { no: '67X',  op: 'kmb', stop: 'AA5DA45828958EAE', dir: 'O', st: 1 },
        { no: '261',  op: 'kmb', stop: 'AA5DA45828958EAE', dir: 'I', st: 1 },
        { no: 'K51',  op: 'mtr', stop: 'K51-U030' },
        { no: 'K51A', op: 'mtr', note: '回程不經景峰花園' }
      ]
    }
  };

  const OP_LABEL = { kmb: '九巴', mtr: '港鐵巴士' };

  const cardsEl = document.getElementById('cards');
  const sublineEl = document.getElementById('subline');
  const cdEl = document.getElementById('cd');
  const barEl = document.getElementById('bar');
  const updatedEl = document.getElementById('updated');
  const refreshBtn = document.getElementById('refresh');
  const clockEl = document.getElementById('clock');
  const thumbEl = document.getElementById('thumb');
  const tabs = Array.from(document.querySelectorAll('.tab'));

  const state = {
    dir: 'out',
    data: { out: {}, back: {} },
    lastUpdated: null
  };

  for (const [dk, dir] of Object.entries(DIRECTIONS)) {
    for (const r of dir.routes) {
      state.data[dk][r.no] = r.note
        ? { note: true }
        : { etas: null, error: false, loading: true };
    }
  }

  /* ---------- rendering ---------- */

  function cardHTML(r) {
    const opClass = r.op;
    const longClass = r.no.length > 3 ? ' long' : '';

    if (r.note) {
      return `<article class="card note" data-route="${r.no}">
        <div class="left">
          <span class="badge ${opClass}${longClass}">${r.no}</span>
          <span class="op">${OP_LABEL[r.op]}</span>
        </div>
        <div class="right">
          <p class="note-title">${r.note}</p>
          <p class="note-sub">可改乘 K51 / 67M / 67X / 261</p>
        </div>
      </article>`;
    }

    return `<article class="card" data-route="${r.no}">
      <div class="left">
        <span class="badge ${opClass}${longClass}">${r.no}</span>
        <span class="op">${OP_LABEL[r.op]}</span>
      </div>
      <div class="right">
        <div class="etas" data-etas></div>
        <p class="err" data-err hidden>暫時未能更新</p>
      </div>
    </article>`;
  }

  function buildCards() {
    const dir = DIRECTIONS[state.dir];
    cardsEl.innerHTML = dir.routes.map(cardHTML).join('');
  }

  function paint() {
    const dir = DIRECTIONS[state.dir];

    for (const r of dir.routes) {
      if (r.note) continue;

      const card = cardsEl.querySelector(`[data-route="${r.no}"]`);
      if (!card) continue;

      const rec = state.data[state.dir][r.no];
      const etas = rec.etas;

      card.querySelector('[data-etas]').innerHTML = [0, 1, 2].map((i) => {
        if (rec.loading && !etas) {
          return '<div class="eta loading"><b>···</b></div>';
        }

        const m = etas ? etas[i] : undefined;

        if (m === undefined) {
          return '<div class="eta empty"><b>—</b><span>分</span></div>';
        }

        if (m <= 0) {
          return `<div class="eta soon${i === 0 ? ' next' : ''}"><b>即將</b></div>`;
        }

        return `<div class="eta${i === 0 ? ' next' : ''}"><b>${m}</b><span>分</span></div>`;
      }).join('');

      const errEl = card.querySelector('[data-err]');
      if (errEl) errEl.hidden = !rec.error;

      card.classList.toggle('stale', !!rec.error);
    }
  }

  function setDir(d) {
    if (!DIRECTIONS[d] || state.dir === d) return;

    state.dir = d;

    for (const t of tabs) {
      t.setAttribute('aria-selected', String(t.dataset.dir === d));
    }

    thumbEl.style.transform = d === 'back' ? 'translateX(100%)' : 'translateX(0)';
    sublineEl.textContent = `上車 ${DIRECTIONS[d].board} · 落車 ${DIRECTIONS[d].alight}`;

    buildCards();
    paint();

    cardsEl.classList.remove('swap');
    void cardsEl.offsetWidth;
    cardsEl.classList.add('swap');
  }

  for (const t of tabs) {
    t.addEventListener('click', () => setDir(t.dataset.dir));
  }

  /* ---------- data ---------- */

  async function fetchJSON(url, options) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);

    try {
      const res = await fetch(url, { ...options, signal: controller.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  async function getMtrSchedule(routeNo, cache) {
    if (cache[routeNo]) return cache[routeNo];

    const json = await fetchJSON(MTR_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ language: 'en', routeName: routeNo }),
      cache: 'no-store'
    });

    cache[routeNo] = json;
    return json;
  }

  async function fetchEtas(r, cache) {
    if (r.op === 'kmb') {
      const url = `${KMB_API}/${r.stop}/${encodeURIComponent(r.no)}/${r.st}`;
      const json = await fetchJSON(url, { cache: 'no-store' });
      const now = Date.now();

      return (json.data || [])
        .filter((e) => e.dir === r.dir && e.eta)
        .map((e) => Math.max(0, Math.round((Date.parse(e.eta) - now) / 60000)))
        .sort((a, b) => a - b)
        .slice(0, 3);
    }

    const json = await getMtrSchedule(r.no, cache);
    const stop = (json.busStop || []).find((s) => s.busStopId === r.stop);

    if (!stop) return [];

    return (stop.bus || [])
      .map((b) => Math.round(Number(b.arrivalTimeInSecond) / 60))
      .filter((m) => Number.isFinite(m) && m >= 0 && m <= 120)
      .sort((a, b) => a - b)
      .slice(0, 3);
  }

  /* ---------- refresh ---------- */

  let refreshing = false;
  let nextAt = Date.now() + REFRESH_MS;

  async function refreshAll() {
    if (refreshing) return;

    refreshing = true;
    refreshBtn.classList.add('busy');

    const cache = Object.create(null);
    const jobs = [];

    for (const dk of Object.keys(DIRECTIONS)) {
      for (const r of DIRECTIONS[dk].routes) {
        if (!r.stop) continue;

        const rec = state.data[dk][r.no];
        if (!rec.etas) rec.loading = true;

        jobs.push((async () => {
          try {
            const etas = await fetchEtas(r, cache);
            rec.etas = etas;
            rec.error = false;
          } catch (err) {
            rec.error = true;
            if (!rec.etas) rec.etas = [];
          } finally {
            rec.loading = false;
          }
        })());
      }
    }

    await Promise.allSettled(jobs);

    state.lastUpdated = new Date();
    refreshing = false;
    refreshBtn.classList.remove('busy');

    paint();
    updatedEl.textContent = state.lastUpdated.toLocaleTimeString('zh-HK', { hour12: false });
    resetCountdown();
  }

  function tick() {
    const ms = Math.max(0, nextAt - Date.now());

    barEl.style.width = (ms / REFRESH_MS * 100).toFixed(2) + '%';
    cdEl.textContent = (refreshing || ms <= 0) ? '更新中…' : `${Math.ceil(ms / 1000)} 秒後更新`;

    if (!refreshing && ms <= 0) refreshAll();
  }

  function resetCountdown() {
    nextAt = Date.now() + REFRESH_MS;

    barEl.style.transition = 'none';
    barEl.style.width = '100%';
    void barEl.offsetWidth;
    barEl.style.transition = '';

    tick();
  }

  refreshBtn.addEventListener('click', () => refreshAll());

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() >= nextAt) refreshAll();
  });

  /* ---------- clock ---------- */

  function updateClock() {
    clockEl.textContent = new Date().toLocaleTimeString('zh-HK', { hour12: false });
  }

  /* ---------- start ---------- */

  buildCards();
  paint();
  updateClock();
  setInterval(updateClock, 1000);
  setInterval(tick, 1000);
  refreshAll();
})();
</script>
</body>
</html>
